name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Regression tests for the things that are easy to break silently:
      # overnight trading hours, absent ratings, and the JSON-LD escaping that
      # stands between a user-submitted description and stored XSS.
      - name: Unit tests
        run: npm test

      # The build is also the performance gate — scripts/prerender.mjs exits
      # non-zero if any page exceeds 180 KB gzipped including CSS and JS.
      # The audience is on prepaid mobile data, so that ceiling is a product
      # requirement, not engineering hygiene.
      #
      # No DATABASE_URL here on purpose: this proves a clean checkout still
      # builds from db/seed.json with no credentials.
      - name: Build and enforce the page-weight budget
        run: npm run build

      # Asserts the pages that must exist whatever the listings are, rather than
      # a page count. A count tracks how many businesses happen to be verified,
      # so it goes red for a content decision and stays green for a real
      # regression that drops, say, every suburb page but leaves the profiles.
      - name: Check the expected pages were emitted
        run: |
          test -f dist/client/index.html
          test -f dist/client/sitemap.xml
          test -f dist/client/robots.txt
          test -f dist/client/find/index.html
          # Every category is linked from the home page, so every category needs
          # a page — including the ones nobody is listed in yet.
          for c in $(node -e "import('./src/lib/categories.js').then(m=>console.log(m.CATEGORIES.map(c=>c.slug).join(' ')))"); do
            test -f "dist/client/$c/index.html" || { echo "missing page for category $c"; exit 1; }
          done
          # Linked from the header and footer of every page, so any one missing
          # is a 404 on the whole site.
          for i in list-your-business how-vetting-works report privacy review thank-you; do
            test -f "dist/client/$i/index.html" || { echo "missing $i"; exit 1; }
          done
          echo "emitted $(find dist/client -name index.html | wc -l) pages"
