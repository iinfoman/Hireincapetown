[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# /tools/* is password-gated by netlify/edge-functions/protect-tools.js, which
# runs before any file is served. This header is belt and braces for anything
# that somehow fetches a tools URL without parsing its noindex meta tag.
[[headers]]
  for = "/tools/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
